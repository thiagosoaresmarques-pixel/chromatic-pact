name: Arauto Divulgação Cloud — TabNews

on:
  workflow_dispatch:
  schedule:
    # Janelas nobres no TabNews (11h20 BRT = 14h20 UTC | 18h20 BRT = 21h20 UTC)
    # O script é 100% idempotente: publica apenas 1 vez e vira noop automático depois.
    - cron: '20 14,21 * * *'

jobs:
  publish-tabnews:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run TabNews Cloud Herald
        env:
          TABNEWS_EMAIL: ${{ secrets.TABNEWS_EMAIL }}
          TABNEWS_PASSWORD: ${{ secrets.TABNEWS_PASSWORD }}
        run: node scripts/runTabNewsHerald.mjs
