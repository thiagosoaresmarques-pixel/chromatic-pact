name: Relatório Executivo Cloud — Funil & Conversão por Canal

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Janela de análise em dias (padrão: 7)'
        required: false
        default: '7'
  schedule:
    # Diariamente às 09h00 BRT (12h00 UTC) e 21h30 BRT (00h30 UTC)
    - cron: '0 12 * * *'
    - cron: '30 0 * * *'

jobs:
  telemetry-funnel-report:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Cloud Acquisition & Conversion Funnel Report
        env:
          CHROMA_ADMIN_USER: ${{ secrets.CHROMA_ADMIN_USER }}
          CHROMA_ADMIN_PASSWORD_HASH: ${{ secrets.CHROMA_ADMIN_PASSWORD_HASH }}
          ADMIN_DISCORD_WEBHOOK_URL: ${{ secrets.ADMIN_DISCORD_WEBHOOK_URL }}
        run: node --import tsx scripts/runTelemetryFunnelReport.ts --days=${{ github.event.inputs.days || '7' }}
